name: Deploy ZeForm to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Cloudflare Pages
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build with Next-on-Pages
        run: npx @cloudflare/next-on-pages
        env:
          NEXT_PUBLIC_MAIN_DOMAIN: zeform.zenstro.space
          NEXTAUTH_URL: https://zeform.zenstro.space
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CLIENTS_CLIENT_ID: ${{ secrets.GOOGLE_CLIENTS_CLIENT_ID }}
          GOOGLE_CLIENTS_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENTS_CLIENT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          CF_ACCOUNT_ID: 3c62fd7b101cb45266bcca6237c80f58
          CF_D1_DB_ID: 7309aefc-20f6-46b4-9c25-1fc0ffee0597
          CF_AUTH_EMAIL: ceo.shubhampathak@gmail.com
          CF_API_KEY: ${{ secrets.CF_API_KEY }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=zeform --branch=main --commit-dirty=true --compatibility-flags=nodejs_compat
